name: Live GLB Browser Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "dist/terrain-medal*"
      - "dist/print-model-core.mjs"
      - "dist/vendor/**"
      - "scripts/build-vendor.mjs"
      - "scripts/live-browser-glb.mjs"
      - ".github/workflows/live-glb-browser.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/live-browser-glb.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glb-browser-diagnostic
          path: glb-preview.png
          if-no-files-found: ignore
