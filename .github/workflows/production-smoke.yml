name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Terrain Medal bundle
        run: |
          python3 - <<'PY'
          import time, urllib.request, sys

          base="https://vmm.vayushastr.workers.dev"
          expected_html="terrain-medal.js?v=35"
          expected_core="print-model-core.mjs?v=8"
          expected_fallback="three-glb-viewer.mjs"
          expected_preview="direct-mesh-preview.mjs?v=1"

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"VMM-Production-Smoke/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status,r.read().decode("utf-8","replace")

          last=""
          for _ in range(12):
              try:
                  hs,html=get(base+"/terrain-medal?smoke="+str(time.time_ns()))
                  js,script=get(base+"/terrain-medal.js?v=35&smoke="+str(time.time_ns()))
                  vs,vendor=get(base+"/vendor/three-glb-viewer.mjs?smoke="+str(time.time_ns()))
                  ps,preview=get(base+"/direct-mesh-preview.mjs?v=1&smoke="+str(time.time_ns()))
                  if hs==200 and js==200 and vs==200 and ps==200 and expected_html in html and expected_core in script and expected_preview in script and "renderProductionMeshPreview" in preview and len(vendor)>1000:
                      print("LIVE PASS: deployed Terrain Medal bundle is current")
                      print(expected_html)
                      print(expected_core)
                      print(expected_fallback)
                      print(expected_preview)
                      sys.exit(0)
                  last=f"html={hs} html_has={expected_html in html} js={js} core_has={expected_core in script} preview_import={expected_preview in script} preview={ps} preview_fn={'renderProductionMeshPreview' in preview} vendor={vs} vendor_len={len(vendor)}"
              except Exception as e:
                  last=repr(e)
              time.sleep(5)

          print("LIVE FAIL:",last)
          sys.exit(1)
          PY
