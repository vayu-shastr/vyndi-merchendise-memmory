<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VYNDI Ride Stories Model Viewer Harness</title>
<style>
html,body{margin:0;background:#050707;color:white;font-family:Arial,sans-serif}
#stage{width:900px;height:560px;margin:20px;background:#0b1012;border:1px solid #3b4b4d}
model-viewer{display:block;width:100%;height:100%;background:radial-gradient(circle at 50% 38%,#20282a 0,#0b1012 58%,#07090a 100%)}
#status{margin:20px}
</style>
</head>
<body>
<div id="stage">
  <model-viewer id="preview" camera-controls touch-action="pan-y" shadow-intensity="0.8" exposure="1.05" camera-orbit="0deg 65deg auto" interaction-prompt="auto" reveal="auto" loading="eager"></model-viewer>
</div>
<div id="status">starting</div>
<script type="module">
import "/dist/vendor/model-viewer.min.js";
import { buildRadialMedalMesh, encodeGlb } from "/dist/print-model-core.mjs?v=9";

const preview=document.querySelector("#preview"),status=document.querySelector("#status");
preview.dataset.renderState="loading";
preview.addEventListener("load",()=>{
  preview.dataset.renderState="ready";
  status.textContent="GLB rendered";
});
preview.addEventListener("error",event=>{
  preview.dataset.renderState="error";
  preview.dataset.renderError=event?.detail?.type||event?.detail?.message||"model load error";
  status.textContent=preview.dataset.renderError;
});

const mesh=buildRadialMedalMesh({
  diameterMm:100,
  baseMm:3,
  rings:24,
  segments:128,
  heightAt:(x,y)=>1.4+Math.sin(x/12)*.55+Math.cos(y/14)*.35,
  regionAt:x=>x>0?2:0
});
const glb=encodeGlb(mesh,{
  title:"VYNDI Ride Stories source-compatible viewer",
  materials:[
    {name:"Terrain",color:"#59666CFF"},
    {name:"Water",color:"#2F9BC1FF"},
    {name:"Route",color:"#FF6A00FF"}
  ]
});
const url=URL.createObjectURL(new Blob([glb],{type:"model/gltf-binary"}));
preview.src=url;
window.addEventListener("beforeunload",()=>URL.revokeObjectURL(url));
</script>
</body>
</html>
